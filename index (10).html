<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Kalkulyator</title>2
<style>
  :root{
    --bg: #1b1b1f;
    --panel: #232328;
    --display-bg: #101013;
    --accent: #ff9f1c;
    --accent-dim: #d97e00;
    --op-bg: #33333a;
    --num-bg: #2b2b31;
    --text: #f4f1ea;
    --muted: #8a8a92;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background: radial-gradient(circle at 50% 0%, #2a2a30, #101012 70%);
    font-family: 'Courier New', Consolas, monospace;
  }
  .calc{
    width: 320px;
    background: var(--panel);
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
    border: 1px solid #35353c;
  }
  .brand{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    padding: 4px 6px 14px;
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .brand span:first-child{
    color: var(--accent);
    font-weight:bold;
    font-size:14px;
  }
  .display{
    background: var(--display-bpg);
    border-radius: 12px;
    padding: 18px 16px;
    margin-bottom: 16px;
    text-align: right;
    overflow: hidden;
    box-shadow: inset 0 2px 8px rgba(0,0,0,0.6);
  }
  .display .expr{
    color: var(--muted);
    font-size: 14px;
    min-height: 18px;
    word-break: break-all;
  }
  .display .result{
    color: var(--text);
    font-size: 36px;
    font-weight: bold;
    min-height: 44px;
    word-break: break-all;
  }
  .keys{
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  button{
    border: none;
    border-radius: 10px;
    padding: 18px 0;
    font-size: 18px;
    font-family: inherit;
    cursor: pointer;
    color: var(--text);
    background: var(--num-bg);
    transition: transform 0.05s ease, filter 0.15s ease;
  }
  button:active{
    transform: scale(0.95);
  }
  button:hover{
    filter: brightness(1.15);
  }
  .op{
    background: var(--op-bg);
    color: var(--accent);
    font-weight: bold;
  }
  .op.active{
    background: var(--accent);
    color: #101012;
  }
  .equal{
    background: var(--accent);
    color: #101012;
    font-weight: bold;
    grid-row: span 2;
  }
  .zero{
    grid-column: span 2;
  }
  .clear{
    background: #4a2a2a;
    color: #ff8a8a;
  }
</style>
</head>
<body>
<div class="calc">
  <div class="brand"><span>MINI • CALC</span><span>UZ</span></div>
  <div class="display">
    <div class="expr" id="expr">&nbsp;</div>
    <div class="result" id="result">0</div>
  </div>
  <div class="keys">
    <button class="clear" data-action="clear">C</button>
    <button class="clear" data-action="back">⌫</button>
    <button class="op" data-action="percent">%</button>
    <button class="op" data-op="/">÷</button>
    <button data-num="7">7</button>
    <button data-num="8">8</button>
    <button data-num="9">9</button>
    <button class="op" data-op="*">×</button>
    <button data-num="4">4</button>
    <button data-num="5">5</button>
    <button data-num="6">6</button>
    <button class="op" data-op="-">−</button>
    <button data-num="1">1</button>
    <button data-num="2">2</button>
    <button data-num="3">3</button>
    <button class="op" data-op="+">+</button>
    <button class="zero" data-num="0">0</button>
    <button data-num=".">.</button>
    <button class="equal" data-action="equals">=</button>
  </div>
</div>

<script>
  const exprEl = document.getElementById('expr');
  const resultEl = document.getElementById('result');

  let current = "0";
  let previous = null;
  let operator = null;
  let justCalculated = false;

  function updateDisplay(){
    resultEl.textContent = current;
    if(operator && previous !== null){
      exprEl.textContent = `${previous} ${opSymbol(operator)}`;
    } else {
      exprEl.textContent = "\u00A0";
    }
    document.querySelectorAll('.op').forEach(b => b.classList.remove('active'));
    if(operator){
      const btn = document.querySelector(`[data-op="${operator}"]`);
      if(btn) btn.classList.add('active');
    }
  }
  function opSymbol(op){
    return {'+':'+', '-':'−', '*':'×', '/':'÷'}[op] || op;
  }
  function inputNumber(num){
    if(justCalculated){
      current = "0";
      justCalculated = false;
    }
    if(num === "." ){
      if(current.includes(".")) return;
      current += ".";
      return;
    }
    if(current === "0"){
      current = num;
    } else {
      current += num;
    }
  }
  function chooseOperator(op){
    if(operator && previous !== null && !justCalculated){
      calculate();
    }
    previous = current;
    operator = op;
    current = "0";
    justCalculated = false;
  }
  function calculate(){
    if(operator === null || previous === null) return;
    const a = parseFloat(previous);
    const b = parseFloat(current);
    let res;
    switch(operator){
      case '+': res = a + b; break;
      case '-': res = a - b; break;
      case '*': res = a * b; break;
      case '/':
        if(b === 0){
          resultEl.textContent = "Nolga bo'lib bo'lmaydi";
          current = "0";
          previous = null;
          operator = null;
          justCalculated = true;
          return;
        }
        res = a / b;
        break;
      default: return;
    }
    res = Math.round((res + Number.EPSILON) * 1e10) / 1e10;
    current = res.toString();
    previous = null;
    operator = null;
    justCalculated = true;
  }
  function clearAll(){
    current = "0";
    previous = null;
    operator = null;
    justCalculated = false;
  }
  function backspace(){
    if(current.length <= 1 || (current.length === 2 && current.startsWith('-'))){
      current = "0";
    } else {
      current = current.slice(0, -1);
    }
  }
  function percent(){
    current = (parseFloat(current) / 100).toString();
  }
  document.querySelectorAll('[data-num]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      inputNumber(btn.dataset.num);
      updateDisplay();
    });
  });

  document.querySelectorAll('[data-op]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      chooseOperator(btn.dataset.op);
      updateDisplay();
    });
  });
  document.querySelector('[data-action="equals"]').addEventListener('click', ()=>{
    calculate();
    updateDisplay();
  });
  document.querySelector('[data-action="clear"]').addEventListener('click', ()=>{
    clearAll();
    updateDisplay();
  });
  document.querySelector('[data-action="back"]').addEventListener('click', ()=>{
    backspace();
    updateDisplay();
  });
  document.querySelector('[data-action="percent"]').addEventListener('click', ()=>{
    percent();
    updateDisplay();
  });
  window.addEventListener('keydown', (e)=>{
    if(e.key >= '0' && e.key <= '9'){ inputNumber(e.key); updateDisplay(); }
    else if(e.key === '.'){ inputNumber('.'); updateDisplay(); }
    else if(['+','-','*','/'].includes(e.key)){ chooseOperator(e.key); updateDisplay(); }
    else if(e.key === 'Enter' || e.key === '='){ calculate(); updateDisplay(); }
    else if(e.key === 'Backspace'){ backspace(); updateDisplay(); }
    else if(e.key === 'Escape'){ clearAll(); updateDisplay(); }
  });
  updateDisplay();
</script>
</body>
</html>
